name: NCCL-SAI offline checks

on:
  push:
    paths:
      - "src/collectives.cc"
      - "src/enqueue.cc"
      - "src/graph/connect.cc"
      - "src/graph/paths.cc"
      - "src/include/graph.h"
      - "src/include/collectives.h"
      - "src/include/comm.h"
      - "src/include/sai_profile.h"
      - "src/init.cc"
      - "src/transport/p2p.cc"
      - "tools/sai/**"
      - ".github/workflows/sai-offline-checks.yml"
  pull_request:
    paths:
      - "src/collectives.cc"
      - "src/enqueue.cc"
      - "src/graph/connect.cc"
      - "src/graph/paths.cc"
      - "src/include/graph.h"
      - "src/include/collectives.h"
      - "src/include/comm.h"
      - "src/include/sai_profile.h"
      - "src/init.cc"
      - "src/transport/p2p.cc"
      - "tools/sai/**"
      - ".github/workflows/sai-offline-checks.yml"

permissions:
  contents: read

jobs:
  schedules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify AlltoAll schedules and data mapping
        run: python3 tools/sai/verify_a2a_algorithms.py --full-scale
      - name: Verify SAI profile activation
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc/include \
            tools/sai/test_profile_activation.cc \
            -o "$RUNNER_TEMP/test_profile_activation"
          "$RUNNER_TEMP/test_profile_activation"
