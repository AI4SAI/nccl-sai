name: NCCL-SAI offline checks

on:
  push:
    paths:
      - "src/collectives.cc"
      - "src/graph/paths.cc"
      - "src/init.cc"
      - "src/transport/p2p.cc"
      - "tools/sai/**"
      - ".github/workflows/sai-offline-checks.yml"
  pull_request:
    paths:
      - "src/collectives.cc"
      - "src/graph/paths.cc"
      - "src/init.cc"
      - "src/transport/p2p.cc"
      - "tools/sai/**"
      - ".github/workflows/sai-offline-checks.yml"

permissions:
  contents: read

jobs:
  schedules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify AlltoAll schedules and data mapping
        run: python3 tools/sai/verify_a2a_algorithms.py --full-scale
